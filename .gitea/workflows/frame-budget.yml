# The @frame-budget replay-follow tests, on the Linux runner, headed Chromium under Xvfb. Issue #16.
#
# These four tests sample the scroll position and refuse their own measurement when the sampler
# interval reaches 50 ms. The Studio's runner account has no GUI session and delivers frames about
# every 150 ms, so ci.yml skips them there with a warning. This job is where they run on every pull
# request. It has NO skip: if this machine cannot deliver frames either, the tests fail by their own
# precondition ("invalid measurement"), and that is the result (#15). The 50 ms guard is not relaxed.
#
# The runner (named hp-elitedesk-wsl-ubuntu, labels linux and ubuntu-24.04) is a small WSL2 machine
# shared with other work: 3 cores, 3 GB. So this job runs these tests and nothing else.
#   - Node 24 as installed there (sjswerdloff, 13 October 2026), not .nvmrc's 26.
#   - Needs, installed once as root: xvfb libnss3 libasound2t64 fonts-liberation. The runner account
#     has no sudo, so the first step checks for them and says so.
#   - node_modules, the build and Playwright's Chromium go on the Windows disk (/mnt/c), not in the WSL
#     virtual disk, which must not grow. The run tree is removed afterwards; the Chromium download and
#     the npm cache are kept between runs.
#   - Each test runs three times with no retries, and .gitea/scripts/frame_budget_report.py fails the
#     job unless exactly four tests ran three times and all passed. Its table of animation-frame and
#     sampler intervals is posted on the pull request: job logs here are not readable by reviewers.
name: frame-budget
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: frame-budget-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: write
  pull-requests: write
defaults:
  run:
    shell: bash -eo pipefail {0}
env:
  FB_ROOT: /mnt/c/ci-work/midst-web-frame-budget
jobs:
  follow:
    name: replay follows the writing (Linux, Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: what this job needs from the machine
        run: |
          missing=""
          command -v xvfb-run >/dev/null || missing="$missing xvfb"
          for p in libnss3 libasound2t64 fonts-liberation; do dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"; done
          if [ -n "$missing" ]; then echo "::error::missing packages:$missing (install once as root: apt-get install -y$missing)"; exit 1; fi
          node --version | grep -q '^v24\.' || { echo "::error::expected Node 24, found $(node --version)"; exit 1; }
          mkdir -p "$FB_ROOT" && test -w "$FB_ROOT" || { echo "::error::cannot write $FB_ROOT"; exit 1; }
          echo "node $(node --version), $(nproc) cores, $(free -m | awk '/^Mem:/ {print $2}') MB"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: copy the tree to the Windows disk
        run: |
          RUN_DIR="$FB_ROOT/run-${{ github.run_id }}-${{ github.run_attempt }}"
          rm -rf "$RUN_DIR"; mkdir -p "$RUN_DIR"
          git archive HEAD | tar -x -C "$RUN_DIR"
          {
            echo "RUN_DIR=$RUN_DIR"
            echo "PLAYWRIGHT_BROWSERS_PATH=$FB_ROOT/ms-playwright"
            echo "npm_config_cache=$FB_ROOT/npm-cache"
          } >> "$GITHUB_ENV"
      # --legacy-peer-deps and --ignore-scripts as in ci.yml.
      - name: install
        run: cd "$RUN_DIR" && npm ci --legacy-peer-deps --ignore-scripts
      - name: Chromium for Playwright (kept between runs)
        run: cd "$RUN_DIR" && npx playwright install chromium
      - name: the frame-budget tests, headed under Xvfb, three times each, no retries
        run: |
          cd "$RUN_DIR"
          export MIDST_E2E_PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          export CI=true PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/frame-budget.json"
          set +e
          xvfb-run -a --server-args="-screen 0 1440x1000x24" npx playwright test --grep "@frame-budget" --headed --repeat-each=3 --retries=0 --reporter=json,list
          echo "PLAYWRIGHT_EXIT=$?" >> "$GITHUB_ENV"
      - name: four tests, three runs each, all passed; and the measured intervals
        if: always()
        run: |
          set +e
          python3 .gitea/scripts/frame_budget_report.py "$RUNNER_TEMP/frame-budget.json" 4 3 "$RUNNER_TEMP/frame-budget.md"; report=$?
          [ -s "$RUNNER_TEMP/frame-budget.md" ] || echo "**frame-budget on the Linux runner: FAILED before any test ran** (no report; see the job's steps)" > "$RUNNER_TEMP/frame-budget.md"
          if [ -n "${{ github.event.pull_request.number }}" ]; then
            python3 -c 'import json,sys; print(json.dumps({"body": open(sys.argv[1]).read() + "\nRun ${{ github.run_number }}, commit ${{ github.sha }}.\n"}))' "$RUNNER_TEMP/frame-budget.md" > "$RUNNER_TEMP/body.json"
            curl -sS -o /dev/null -w "comment http=%{http_code}\n" -X POST -H "Authorization: token ${{ github.token }}" -H "Content-Type: application/json" \
              --data-binary "@$RUNNER_TEMP/body.json" "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"
          fi
          [ "$report" = 0 ] && [ "${PLAYWRIGHT_EXIT:-1}" = 0 ]
      - name: remove the run tree (the Chromium download and npm cache stay)
        if: always()
        run: '[ -n "${RUN_DIR:-}" ] && rm -rf "$RUN_DIR" || true'
