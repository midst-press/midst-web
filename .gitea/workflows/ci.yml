# Gitea CI, on the Mac Studio's self-hosted runner. The GitHub workflow in .github/workflows/ci.yml
# runs the same gates and build on GitHub's Linux runners; keep them in step.
#
# Gitea reads .gitea/workflows/ in preference to .github/workflows/, so the GitHub workflows (CI and
# the canary against the live site) do not run here.
#
# Pinned to the Studio (stuart-m3ultra-canary): its runner is a separate `gitearunner` account,
# where the other macOS runner is the account every Kindled session on that machine shares.
#
# Homebrew first, always: every step runs under Homebrew's bash, the job puts Homebrew at the front
# of PATH, and .gitea/scripts/toolchain_guard.sh fails the job if what macOS ships (bash 3.2,
# Python 3.9, Apple git) is what it actually got, or if node differs from .nvmrc. Node is Homebrew's
# too, not setup-node's: this runner gives every job a fresh, empty tool cache, so setup-node
# downloaded Node on every job. pre-commit goes into a throwaway virtual environment.
#
# npm ci runs with --ignore-scripts, as in midst-format and midst-editor: in host mode a dependency's
# install script would run on the Studio itself, as the runner account, for every pull request. The
# build does not need them (measured: the same 109 files either way).
#
# The end-to-end suite runs here too (job e2e). Its Chromium is installed into the runner account's
# Playwright cache, so only the first job downloads it.
#
# Heavy jobs on a PR's turn (midst-infra #102). gates runs on every event. build, e2e and coverage run on a push
# to main, and on a PR only while it carries the `ci-turn` label (the merge sweep's: this PR is next to merge)
# or `full-ci` (an author's: run them now, before the turn). Any labelled run on such a PR runs them, whatever
# label was added: a narrower condition lets another label post `skipped` over the turn's result.
# Removing a label is NOT kept out by leaving `unlabeled` out of types: Gitea sends removing one label as the
# same event as adding one (label_updated, a `labeled` run; only clearing every label is `unlabeled`). So taking
# ci-turn off starts a run, which cancels a heavy run in progress and posts `skipped` for the heavy jobs (seen
# on #200, runs 9848 and 9850). The merge sweep must not remove the label while that PR's CI is running.
# Each heavy job first asks whether its commit is still the PR's head (.gitea/scripts/still_head.sh) and, if
# the PR has moved on, stops there: a second guard, for a superseded run that cancel-in-progress misses.
name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
concurrency:
  # A PR's runs share its ref; each push to main gets its own group, so a newer one cannot cancel it even while pending.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Cancel a superseded run on a PR only: every push to main keeps its own verdict (midst-infra #102).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
# Every build and every end-to-end run names its key scheme; there is no default (#41). The jobs run
# under legacy, which is what production holds; the e2e job then builds again under canonical.
env:
  MIDST_KEY_SCHEME: legacy
  MIDST_POEM_LIST: bundled
defaults:
  run:
    shell: /opt/homebrew/bin/bash -eo pipefail {0}
jobs:
  gates:
    runs-on: stuart-m3ultra-canary
    steps:
      - name: Homebrew first on PATH
        run: |
          echo /opt/homebrew/sbin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the poem-ids hook compares ids with the merge base on origin/main (#65)
      - name: toolchain guard (Homebrew first, current versions)
        run: bash .gitea/scripts/toolchain_guard.sh .nvmrc
      - run: npm ci --ignore-scripts
      # Unit tests for the non-GUI code (#14). Each file in package.json's jest.collectCoverageFrom has its own
      # threshold, so an untested file counts as 0% and any drop fails this step.
      # Every threshold is 100% except src/store/reducer.ts (99% lines, 94% branches): its one uncovered line and
      # branch are line 118, the function's closing brace, which Jest's V8 converter counts and nothing can run.
      - name: unit tests with coverage thresholds
        run: npm test -- --coverage
      - name: the coverage control's messages each fire
        run: npm run test:coverage-control
      # The e2e server must hold its port from the start and fail early when it is taken (#35).
      # No dependencies: node's own test runner.
      - name: e2e server holds its port
        run: node --test tools/test-serve-local.mjs
      - name: read-only checkout of editor main for helper provenance
        env:
          DEPLOY_KEY: ${{ secrets.MIDST_EDITOR_DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          umask 077
          MIDST_EDITOR_ROOT="$(mktemp -d "$RUNNER_TEMP/midst-editor-provenance.XXXXXX")"
          printf 'MIDST_EDITOR_ROOT=%s\n' "$MIDST_EDITOR_ROOT" >> "$GITHUB_ENV"
          EDITOR_KEY="$(mktemp "$RUNNER_TEMP/midst-editor-key.XXXXXX")"
          trap 'rm -f "$EDITOR_KEY"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$EDITOR_KEY"
          printf '%s\n' '[gitea-server]:2222 ssh-rsa ' > "$RUNNER_TEMP/editor_known_hosts"
          export GIT_SSH_COMMAND="ssh -F /dev/null -p 2222 -i $EDITOR_KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/editor_known_hosts"
          git clone --quiet --branch main stuartswerdloff@gitea-server:The_Kindled/midst-editor.git "$MIDST_EDITOR_ROOT"
      - name: pre-commit, in a throwaway virtual environment
        run: |
          python3 -m venv "$RUNNER_TEMP/precommit"
          "$RUNNER_TEMP/precommit/bin/pip" install --quiet 'pre-commit==4.6.2'
          "$RUNNER_TEMP/precommit/bin/pre-commit" run --all-files --show-diff-on-failure
      # The message catalog (midst-infra docs/design/message-catalog.md): does it match the code, is it consistent,
      # how many words are still written into the code, and is Lingui held below 6. Report only, except the pin:
      # each migration PR makes the part it migrates enforcing.
      - name: message catalog (report only)
        run: npm run catalog:report
      - name: vendored midst-format matches its VENDOR.md hashes
        run: node tools/check-vendored-format.mjs
      # Rebuilds the tag VENDOR.md names and byte-compares it with vendor/midst-format/, so the hashes are not
      # the only check: they can be edited in the same commit as the files. midst-format is public on Gitea, so
      # the clone needs no key (the "private" premise was wrong; checked anonymously 19 Oct).
      - name: vendored midst-format equals a rebuild of its tag
        run: |
          git clone --quiet http://gitea-server:3000/The_Kindled/midst-format.git "$RUNNER_TEMP/midst-format"
          MIDST_FORMAT_ROOT="$RUNNER_TEMP/midst-format" node tools/check-vendored-format.mjs --rebuild

  build:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-turn') || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: stuart-m3ultra-canary
    steps:
      - name: Homebrew first on PATH
        run: |
          echo /opt/homebrew/sbin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: is this commit still the PR's head?
        id: head
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
          TOKEN: ${{ github.token }}
        run: bash .gitea/scripts/still_head.sh
      - name: toolchain guard (Homebrew first, current versions)
        if: steps.head.outputs.current == 'true'
        run: bash .gitea/scripts/toolchain_guard.sh .nvmrc
      - if: steps.head.outputs.current == 'true'
        run: npm ci --ignore-scripts
      - if: steps.head.outputs.current == 'true'
        run: npm run build
      - name: record what was built
        if: steps.head.outputs.current == 'true'
        run: echo "files=$(find dist -type f | wc -l | tr -d ' ') kilobytes=$(du -sk dist | cut -f1)"

  e2e:
    name: end-to-end (does a poem still play?)
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-turn') || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: stuart-m3ultra-canary
    steps:
      - name: Homebrew first on PATH
        run: |
          echo /opt/homebrew/sbin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: is this commit still the PR's head?
        id: head
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
          TOKEN: ${{ github.token }}
        run: bash .gitea/scripts/still_head.sh
      - name: toolchain guard (Homebrew first, current versions)
        if: steps.head.outputs.current == 'true'
        run: bash .gitea/scripts/toolchain_guard.sh .nvmrc
      - if: steps.head.outputs.current == 'true'
        run: npm ci --ignore-scripts
      - if: steps.head.outputs.current == 'true'
        run: npx playwright install chromium
      # Jobs on this runner share one host, and CI runs in parallel, so a fixed port could collide.
      # playwright.config.ts and the e2e npm scripts all read MIDST_E2E_PORT.
      # The port is free when picked and is bound a moment later, when Playwright starts e2e:serve,
      # which takes it BEFORE building and exits 3 at once if another job got there first (#35).
      - name: pick a free port
        if: steps.head.outputs.current == 'true'
        run: echo "MIDST_E2E_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
      # Fixtures are generated, never committed: invented content under real published names.
      # The @frame-budget tests don't run in this job, so a green run of it says nothing about following.
      # On this runner the four follow tests run in .gitea/workflows/frame-budget.yml, under the host profile,
      # which this runner's stalls allow (midst-infra #102); the @frame-budget recorder test does not run on
      # Gitea at all. Strict, all of them run in .github/workflows/frame-budget.yml on GitHub, on the push-up.
      # The @gui legacy-runtime tests need a GUI (their sampler precondition, #28), and run only there too.
      - name: run e2e (not the frame-budget or @gui tests; see .gitea and .github frame-budget.yml)
        if: steps.head.outputs.current == 'true'
        run: npx playwright test --grep-invert "@frame-budget|@gui"
      # CI is set, so the web server rebuilds the site and its fixtures under this scheme. These are
      # the specs that touch object names; none of them is a frame-budget test.
      - name: the same site under canonical keys
        if: steps.head.outputs.current == 'true'
        env:
          MIDST_KEY_SCHEME: canonical
        run: npx playwright test e2e/key-scheme.spec.ts e2e/poem-plays.spec.ts e2e/load-failure.spec.ts e2e/asset-canary.spec.ts
      - name: the site with the published poem list
        if: steps.head.outputs.current == 'true'
        env:
          MIDST_POEM_LIST: published
        run: npx playwright test --config playwright.published.config.ts

  # What the unit and e2e tests execute, as numbers. A second build and run on purpose: coverage needs an
  # unminified build to map back to src/, and the e2e job above must keep testing the build that
  # ships. Prints file paths and percentages only; see scripts/coverage-merge.mjs. Reported, not gated
  # on any figure: this job fails only if the tests fail or the measurement's own control does.
  coverage:
    name: coverage (what the tests execute; numbers only)
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-turn') || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: stuart-m3ultra-canary
    steps:
      - name: Homebrew first on PATH
        run: |
          echo /opt/homebrew/sbin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: is this commit still the PR's head?
        id: head
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_URL: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
          TOKEN: ${{ github.token }}
        run: bash .gitea/scripts/still_head.sh
      - name: toolchain guard (Homebrew first, current versions)
        if: steps.head.outputs.current == 'true'
        run: bash .gitea/scripts/toolchain_guard.sh .nvmrc
      - if: steps.head.outputs.current == 'true'
        run: npm ci --ignore-scripts
      - if: steps.head.outputs.current == 'true'
        run: npx playwright install chromium
      - name: pick a free port
        if: steps.head.outputs.current == 'true'
        run: echo "MIDST_E2E_PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')" >> "$GITHUB_ENV"
      # Excludes the @frame-budget and @gui tests, which never run on this runner (see the e2e job above).
      - name: coverage (not the frame-budget or @gui tests)
        if: steps.head.outputs.current == 'true'
        env:
          MIDST_COVERAGE_TEST_ARGS: --grep-invert @frame-budget|@gui
        run: npm run coverage
