# Run locally on every commit, and in CI by the SAME command:
#     pre-commit run --all-files --show-diff-on-failure
# One config, two callers, so local and CI gates cannot drift apart.
#
# Install once per clone:  pre-commit install
#
# GENERATED AND VENDORED FILES ARE NOT OURS TO REFORMAT. The player was built by vendoring
# jQuery, Rangy, React and zip.js directly into the tree, and static/ holds third-party font
# specimens and worker scripts. Reformatting a minified vendor bundle can change its meaning and
# will certainly destroy its diffability against upstream. One anchor, aliased by every hook that
# WRITES, so the list cannot drift between them. Hooks that only VALIDATE (check-json, check-yaml)
# deliberately still cover these files.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# The checks run on commit, and in CI by `pre-commit run`. Only the hooks below that name another stage run there:
# the closing-keyword check on the commit message, the force-push refusal on push.
default_stages: [pre-commit, manual]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: &vendored '(^static/|^etc/|^src/components/MidstPlayer/(follow|helpers)\.ts$|^src/__tests__/editor-(follow|followMore|trackingUtils)\.test\.ts$|^e2e/legacy-player/base64icons/|(^|/)(package-lock\.json|yarn\.lock)$)'
      - id: end-of-file-fixer
        exclude: *vendored
      - id: check-merge-conflict
      - id: check-case-conflict        # macOS/Linux collisions; this repo has accented filenames
      - id: check-json
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: *vendored
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=2048]

  # ---- local guards. These enforce policy mechanically rather than by discipline. ----
  - repo: local
    hooks:
      - id: editor-helpers-identical
        name: copied player helpers and their tests match the pinned midst-editor commit
        language: system
        entry: node tools/check-editor-helpers.mjs
        pass_filenames: false
        always_run: true
        # Show the output when it passes too: that is where the warning about copies behind editor main is.
        verbose: true
      - id: editor-helpers-check-self-test
        name: the provenance check passes on faithful copies and fails on anything else
        language: system
        entry: node --test tools/test-check-editor-helpers.mjs
        pass_filenames: false
        files: '^tools/(test-)?check-editor-helpers\.mjs$'
      - id: import-case
        name: relative imports are spelled exactly as git names the file (macOS hides this; Linux does not)
        language: system
        entry: node tools/check-import-case.mjs
        pass_filenames: false
        always_run: true
      - id: import-case-self-test
        name: the import-case check reports a wrong-case import, and only that
        language: system
        entry: node --test tools/test-check-import-case.mjs
        pass_filenames: false
        files: '^tools/(test-)?check-import-case\.mjs$'
      - id: frame-budget-report-self-test
        name: the frame-budget attestation reads the verdict the spec attached, and names why a run failed (#20, #68)
        language: system
        entry: node --test tools/test-frame-budget-report.mjs
        pass_filenames: false
        files: '^(tools/(test-)?frame-budget-(report|attest)\.mjs|e2e/replay-follow\.spec\.ts)$'
      - id: seed-published-self-test
        name: the published-list seed refuses an inconsistent or unstaged list, and names no poem
        language: system
        entry: node --test tools/test-seed-published.mjs
        pass_filenames: false
        files: '^(tools/(test-)?seed-published\.mjs|src/poems/key-scheme\.js)$'
      - id: forbid-poem-data
        name: poem data must never be committed
        language: fail
        entry: >-
          Poem timelapses are the poets' work and must not enter git. A public push cannot be
          withdrawn. Keep them with the archive and point MIDST_CORPUS at it. See DATA.md.
        files: '(\.midst$|\.midst\.zip$|(^|/)static/static/assets/poems/)'
      - id: forbid-font-files
        name: font files must never be committed
        language: fail
        entry: >-
          Font files do not belong in this public repository: some of the site's fonts are
          commercial, and publishing the files here is not what a webfont licence allows. They are
          served from MIDST_FONTS_URL (src/fonts.ts, src/font-faces.json). Tests use the synthetic
          font that tools/make-e2e-fixtures.mjs writes. See issue #55.
        files: '(?i)\.(ttf|otf|woff2?|eot)$'

      - id: one-lockfile-only
        name: npm is the only package manager; no second lockfile
        language: fail
        entry: >-
          This project uses npm and only npm, and package-lock.json is the one lockfile. A second
          lockfile silently disagrees with the first: yarn.lock here described Parcel 1 after the
          migration to Parcel 2, was missing the process polyfill the build needs, and was missing
          the declared dependency lazy-require entirely -- so `yarn install` built a tree that did
          not match package.json and nothing reported it. See README and issue #24.
        files: '(^|/)(yarn\.lock|pnpm-lock\.yaml|bun\.lockb|npm-shrinkwrap\.json)$'
      - id: forbid-logs
        name: logs must never be committed
        language: fail
        entry: >-
          Log files carry absolute paths, usernames and environment details. yarn-error.log in the
          fork point contained a contributor's home directory and full shell PATH.
        files: '(\.log$|(^|/)logs/)'
      - id: prettier
        name: prettier (repo's own pinned version)
        language: system
        entry: npx --no-install prettier --write
        files: '\.(ts|tsx|js|jsx|json|css|scss|md|ya?ml)$'
        exclude: *vendored
      - id: typecheck
        name: tsc --noEmit (the build does NOT typecheck; it sets TS_NODE_TRANSPILE_ONLY)
        language: system
        entry: npx --no-install tsc --noEmit
        pass_filenames: false
        files: '\.(ts|tsx)$'
      - id: poem-object-names
        name: derived poem object names still match the bucket (snapshot)
        language: system
        entry: node tools/test-poem-names.mjs
        pass_filenames: false
        files: '^(src/poems/[^/]+\.json|src/poems/poem-names\.js|tools/poem-names\.snapshot\.json)$'
      - id: poem-ids
        name: every poem has an opaque id, and no two share one
        language: system
        entry: node tools/poem-ids.mjs
        pass_filenames: false
        files: '^(src/poems/[^/]+\.json|tools/poem-ids\.mjs)$'
      - id: poem-ids-self-test
        name: the poem id check passes on sound ids and names each way they can be wrong
        language: system
        entry: node --test tools/test-poem-ids.mjs
        pass_filenames: false
        files: '^tools/(test-)?poem-ids\.mjs$'
      - id: key-scheme-self-test
        name: the build refuses a missing or unknown key scheme or poem list, and canonical needs an id on every published poem
        language: system
        entry: node --test tools/test-check-key-scheme.mjs
        pass_filenames: false
        files: '^(src/poems/[^/]+\.json|src/poems/(key-scheme|poem-list)\.js|tools/(test-)?check-key-scheme\.mjs)$'
      - id: poem-index-generated
        name: src/poems/index.ts is generated and consistent with the metadata
        language: system
        entry: node tools/generate-poem-index.mjs
        pass_filenames: false
        files: '^src/poems/([^/]+\.json|index\.ts)$'
      - id: unused-dependencies
        name: declared but unused dependencies (fails only on NEW ones)
        language: system
        entry: node tools/check-unused-deps.mjs
        pass_filenames: false
        files: '^(package\.json|\.depcheckrc\.yaml|dependency-baseline\.json)$'

      # ---- closing keywords. GitHub applies "fixes #25" in a commit message to ITS issue 25, which is not
      # ours: our commits use Gitea's numbers. Two GitHub items were closed that way (midst-infra #14). ----
      - id: no-closing-keyword-in-commit-message
        name: no closing keyword in a commit message (write Refs #N; the keyword goes in the Gitea PR body)
        language: system
        entry: python3 tools/closing_refs.py --message-file
        stages: [commit-msg]
      - id: midst-infra-copies
        name: tools/closing_refs.py, tools/issue_flow.py, tools/refuse_force_push.py and deploy/beta/ are copies from midst-infra (change them there first, then here with the checksums)
        language: system
        entry: shasum -a 256 -c tools/midst-infra-copies.sha256
        pass_filenames: false
        files: '^(tools/(closing_refs\.py|issue_flow\.py|refuse_force_push\.py|midst-infra-copies\.sha256)|deploy/beta/.*)$'

      # ---- a pushed branch is never rewritten. The servers refuse it (Gitea and GitHub); this says so before
      # anything is sent, and what to do instead. A copy from midst-infra, tested there. ----
      - id: refuse-force-push
        name: no rewriting a pushed branch (merge the base in instead of rebasing)
        language: system
        entry: python3 tools/refuse_force_push.py
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      - id: pre-push-hook-installed
        name: this clone has the pre-push hook (npm ci or pre-commit install adds it)
        language: system
        entry: python3 tools/refuse_force_push.py --installed
        always_run: true
        pass_filenames: false
