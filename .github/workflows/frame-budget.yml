name: frame-budget
# The @frame-budget replay-follow tests on a GitHub-hosted Linux runner, with Chromium headed under Xvfb.
# Issue #16; sjswerdloff, 13 October 2026.
#
# These five tests sample the scroll position and refuse their own measurement when the sampler interval
# reaches 50 ms. The self-hosted Gitea runner delivers frames about every 150 ms, so Gitea's ci.yml never
# runs them (#15). This job is where they run: `npm run e2e:frame-budget:attest`, three times, with the
# three attestation blocks in the job summary and an artefact. It runs on the push-up after the Gitea
# merge; a red run goes to the orchestrator (PROGRAMME.md). The hand-run Mac attestation is retired.
#
# It is not a required check. The 50 ms guard is not relaxed here: if this machine cannot deliver frames,
# the tests fail by their own precondition ("invalid measurement"), the tool refuses, and that is the
# result.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: frame-budget-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# No default exists (#41); these tests are about the player, so either scheme would do.
env:
  MIDST_KEY_SCHEME: legacy
  MIDST_POEM_LIST: bundled

jobs:
  attest:
    name: replay follows the writing (ubuntu-latest, Xvfb, three runs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts as in ci.yml: no dependency's install script runs on the runner.
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: xvfb
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: machine
        run: echo "$(nproc) cores, $(free -m | awk '/^Mem:/ {print $2}') MB, node $(node --version)"
      # Each run is a whole attestation: its own build, five tests, no retries. A refusal or failure in
      # one run does not stop the others, so the summary shows all three; the step fails if any did.
      - name: attest three times, headed under Xvfb
        shell: bash
        run: |
          failed=0
          for run in 1 2 3; do
            echo "### Run $run" >> "$RUNNER_TEMP/frame-budget.md"
            if xvfb-run -a --server-args="-screen 0 1440x1000x24" npm run --silent e2e:frame-budget:attest -- --headed > "$RUNNER_TEMP/run-$run.md" 2> "$RUNNER_TEMP/run-$run.err"; then
              cat "$RUNNER_TEMP/run-$run.md" >> "$RUNNER_TEMP/frame-budget.md"
            else
              failed=1
              # xvfb-run sends the command's stderr to stdout, so the tool's refusal is in the .md file.
              { echo; echo "**Run $run did not produce an attestation:**"; echo; echo '```'; tail -n 60 "$RUNNER_TEMP/run-$run.md" "$RUNNER_TEMP/run-$run.err"; echo '```'; } >> "$RUNNER_TEMP/frame-budget.md"
            fi
          done
          cat "$RUNNER_TEMP/frame-budget.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/frame-budget.md"
          exit "$failed"
      # The two legacy-runtime tests need a GUI (their sampler precondition, #28). Run them headed
      # under the same Xvfb. The attest tool greps only @frame-budget, so they are separate.
      - name: legacy-runtime follow tests (headed under Xvfb)
        run: xvfb-run -a --server-args="-screen 0 1440x1000x24" npx playwright test --grep @gui --headed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frame-budget-${{ github.sha }}
          path: ${{ runner.temp }}/frame-budget.md
          retention-days: 30
