name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Every build and every end-to-end run names its key scheme; there is no default (#41). The jobs run
# under legacy, which is what production holds. The e2e job then builds the site again under canonical
# and runs the specs that touch object names, so both schemes stay tested whichever a deployment uses.
env:
  MIDST_KEY_SCHEME: legacy
  MIDST_POEM_LIST: bundled

# WHY THE REQUIRED JOBS RUN ON LINUX, AND WHY ONE DOES NOT
#
# They ran on macos-latest for a few hours, because the site had only ever been built on macOS and
# turned out to DEPEND on that: src/poems/index.ts required './torrin_a._greathouse' while the file is
# 'Torrin_A._Greathouse.json', which resolves on a case-insensitive filesystem and nowhere else.
#
# That is fixed, and Linux has passed every run since. Two measured reasons to move back:
#
#   QUEUE  macOS jobs queued 308-309 seconds repeatedly while the Linux job on the same run queued
#          3-39s. GitHub annotates it: "jobs targeting macOS arm64 runners may experience longer
#          queue times."
#   COST   GitHub-hosted macOS minutes bill at 10x Linux. Irrelevant once this repo is public, and
#          not irrelevant before that.
#
# The non-blocking job is now the macOS one, inverted for the same reason it existed before: the
# platform we do NOT gate on is the one worth watching, and every deployment to date was built by
# hand on a Mac. Do not delete it to make the checks page green.

jobs:
  gates:
    name: gates (the same hooks your commit runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the poem-ids hook compares ids with the merge base on origin/main (#65)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.14' }
      - run: npm ci --ignore-scripts
      # Unit tests for the non-GUI code (#14). Each file in package.json's jest.collectCoverageFrom has its own
      # threshold, so an untested file counts as 0% and any drop fails this step.
      # Every threshold is 100% except src/store/reducer.ts (99% lines, 94% branches): its one uncovered line and
      # branch are line 118, the function's closing brace, which Jest's V8 converter counts and nothing can run.
      - name: unit tests with coverage thresholds
        run: npm test -- --coverage
      - name: the coverage control's messages each fire
        run: npm run test:coverage-control
      # The e2e server must hold its port from the start and fail early when it is taken (#35).
      # No dependencies: node's own test runner.
      - name: e2e server holds its port
        run: node --test tools/test-serve-local.mjs
      - run: pip install 'pre-commit==4.6.2'
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: vendored midst-format matches its VENDOR.md hashes
        run: node tools/check-vendored-format.mjs
      # Rebuilds the tag VENDOR.md names and byte-compares it with vendor/midst-format/. It runs in Gitea CI. Here
      # it waits until the tag is on GitHub's midst-press/midst-format, which comes with the next push-up (Stuart's):
      # without the tag the clone has nothing to rebuild and the step would fail.
      # - name: vendored midst-format equals a rebuild of its tag
      #   run: |
      #     git clone --quiet https://github.com/midst-press/midst-format.git "$RUNNER_TEMP/midst-format"
      #     MIDST_FORMAT_ROOT="$RUNNER_TEMP/midst-format" node tools/check-vendored-format.mjs --rebuild

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}
          path: dist/
          retention-days: 30
      - name: record what is in the artefact
        run: |
          echo '### Build artefact' >> "$GITHUB_STEP_SUMMARY"
          echo "commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "files: $(find dist -type f | wc -l | tr -d ' ')" >> "$GITHUB_STEP_SUMMARY"
          echo "kilobytes: $(du -sk dist | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: end-to-end (does a poem still play?)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # Fixtures are GENERATED here, not committed: they are .midst.zip files that the poem-data hook
      # refuses outright, and their deflate output is not byte-reproducible across platforms. The
      # generator derives their names from the app's own slug module, so if that derivation changes the
      # app asks for a name no fixture has and the tests go red -- which is the guarantee we wanted,
      # and it holds without storing anything poem-shaped in git.
      - run: npx playwright test --grep-invert "@gui"
      # CI is set, so the web server rebuilds the site and its fixtures under this scheme.
      - name: the same site under canonical keys
        env:
          MIDST_KEY_SCHEME: canonical
        run: npx playwright test e2e/key-scheme.spec.ts e2e/poem-plays.spec.ts e2e/load-failure.spec.ts e2e/asset-canary.spec.ts
      - name: the site with the published poem list
        env:
          MIDST_POEM_LIST: published
        run: npx playwright test --config playwright.published.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

  # What the unit and e2e tests execute, as numbers. A second build and run on purpose: coverage needs an
  # unminified build to map back to src/, and the e2e job above must keep testing the build that
  # ships. Prints file paths and percentages only; see scripts/coverage-merge.mjs. Reported, not gated
  # on any figure: this job fails only if the tests fail or the measurement's own control does.
  # The @frame-budget tests are excluded here, as in Gitea's coverage job: they need a real frame cadence
  # (Chromium headed under Xvfb), and they run in frame-budget.yml.
  coverage:
    name: coverage (what the tests execute; numbers only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: coverage (not the frame-budget or @gui tests; those run in frame-budget.yml)
        env:
          MIDST_COVERAGE_TEST_ARGS: --grep-invert @frame-budget|@gui
        run: npm run coverage

  # NON-BLOCKING. Exists so Linux breakage is VISIBLE rather than unknown. Do not make this
  # required until its findings are worked through -- and do not delete it to make the page green,
  # because then nobody learns anything. See the Linux-portability issue.
  portability-macos:
    name: portability on macOS (non-blocking)
    runs-on: macos-latest
    # macOS minutes bill at 10x on the free plan, and this job never blocks. Run it on pushes to main only,
    # not on every PR update (Stuart, 13 Oct).
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: build on a case-INsensitive filesystem
        run: npm run build
      - name: report
        if: always()
        run: |
          echo '### Linux portability' >> "$GITHUB_STEP_SUMMARY"
          echo 'Non-blocking. A failure here is a portability defect to record, not a reason to' >> "$GITHUB_STEP_SUMMARY"
          echo 'hold the PR. The most likely cause is a filename whose case does not match the' >> "$GITHUB_STEP_SUMMARY"
          echo 'import that refers to it; macOS resolves those and Linux does not.' >> "$GITHUB_STEP_SUMMARY"
