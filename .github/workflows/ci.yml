name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

# WHY macos-latest FOR THE REQUIRED JOBS
#
# This site has only ever been built on macOS, and it turned out to DEPEND on that: src/poems/index.ts
# required './torrin_a._greathouse' while the file is 'Torrin_A._Greathouse.json', which resolves on a
# case-insensitive filesystem and nowhere else. That is fixed, but it is unlikely to be the only such
# dependency in a codebase nobody has ever built on Linux.
#
# So the required jobs run where the site is known to work, and a NON-BLOCKING Linux job runs
# alongside to keep portability visible instead of unknown. Deliberate sequencing: get green and
# stable first, then make it portable. The Linux job's failures are the to-do list for that, and they
# are tracked rather than ignored.
jobs:
  gates:
    name: gates (the same hooks your commit runs)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: '3.12' }
      # --legacy-peer-deps: React 18 against @types/react 16.9. A real mismatch, not a flag to
      # paper over it -- see #11.
      - run: npm ci --legacy-peer-deps
      - run: pip install 'pre-commit==4.6.0'
      - run: pre-commit run --all-files --show-diff-on-failure

  build:
    name: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}
          path: dist/
          retention-days: 30
      - name: record what is in the artefact
        run: |
          echo '### Build artefact' >> "$GITHUB_STEP_SUMMARY"
          echo "commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "files: $(find dist -type f | wc -l | tr -d ' ')" >> "$GITHUB_STEP_SUMMARY"
          echo "kilobytes: $(du -sk dist | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: end-to-end (does a poem still play?)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      # Fixtures are GENERATED here, not committed: they are .midst.zip files that the poem-data hook
      # refuses outright, and their deflate output is not byte-reproducible across platforms. The
      # generator derives their names from the app's own slug module, so if that derivation changes the
      # app asks for a name no fixture has and the tests go red -- which is the guarantee we wanted,
      # and it holds without storing anything poem-shaped in git.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

  # NON-BLOCKING. Exists so Linux breakage is VISIBLE rather than unknown. Do not make this
  # required until its findings are worked through -- and do not delete it to make the page green,
  # because then nobody learns anything. See the Linux-portability issue.
  portability-linux:
    name: portability on Linux (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: build on a case-sensitive filesystem
        run: npm run build
      - name: report
        if: always()
        run: |
          echo '### Linux portability' >> "$GITHUB_STEP_SUMMARY"
          echo 'Non-blocking. A failure here is a portability defect to record, not a reason to' >> "$GITHUB_STEP_SUMMARY"
          echo 'hold the PR. The most likely cause is a filename whose case does not match the' >> "$GITHUB_STEP_SUMMARY"
          echo 'import that refers to it; macOS resolves those and Linux does not.' >> "$GITHUB_STEP_SUMMARY"
