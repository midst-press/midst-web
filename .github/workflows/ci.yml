name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  gates:
    name: gates (the same hooks your commit runs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '3.12' }
      # --legacy-peer-deps: React 18 against @types/react 16.9. A real mismatch, not a flag to
      # paper over it -- see issue: align the React types with the React version.
      - run: npm ci --legacy-peer-deps
      - run: pip install 'pre-commit==4.6.0'
      - run: pre-commit run --all-files --show-diff-on-failure

  build:
    name: build (Parcel 1, EOL toolchain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      # Parcel 1.12.4 is unmaintained and depends on `deasync`, a native module needing node-gyp.
      # It targets the Node 8-12 era; the last known-good build of this site used Node 10.16.3.
      # Node 14 is the newest version it is known to tolerate, and 14 is itself EOL.
      # THIS PIN IS A STOPGAP. Migrating off Parcel 1 is tracked work, and until it lands nobody
      # can build this site on a current machine.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with: { node-version: '14' }
      - run: npm install --legacy-peer-deps
      - run: npx parcel build src/index.html --out-dir dist --public-url ./
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: site-${{ github.sha }}
          path: dist/
          retention-days: 30
      - name: record what is in the artefact
        run: |
          echo '### Build artefact' >> "$GITHUB_STEP_SUMMARY"
          echo "commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "files: $(find dist -type f | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          echo "bytes: $(du -sb dist | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
